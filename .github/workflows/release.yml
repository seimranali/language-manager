name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-release.mjs ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            release/*.tar.gz
            release/*.zip
          if-no-files-found: error

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: bundles, merge-multiple: true }
      - run: gh release create "$GITHUB_REF_NAME" bundles/* --title "$GITHUB_REF_NAME" --notes-file INSTALL.md
        env:
          GH_TOKEN: ${{ github.token }}
